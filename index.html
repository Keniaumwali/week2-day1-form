
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1>Student Registration</h1>
        <p>Fill in your details and choose the courses you want to study.</p>

        <form>
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname"
                   placeholder="Enter your first name" required>

            <label for="secondname">Second Name</label>
            <input type="text" id="secondname" name="secondname"
                   placeholder="Enter your second name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email address" required>

            <label for="contact">Contact Number</label>
            <input type="tel" id="contact" name="contact"
                   placeholder="Enter your phone number" required>

            <label for="course">Choose Your Course</label>
            <select id="course" name="course" required>
                <option value="">-- Select a course --</option>
                <option value="web-development">Web Development</option>
                <option value="ui-ux-design">UI/UX Design</option>
                <option value="javascript">JavaScript Programming</option>
                <option value="database">Database Management</option>
                <option value="cybersecurity">Cybersecurity</option>
                <option value="networking">Computer Networking</option>
            </select>
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
            </select>

            <button type="submit">Register Now</button>
        </form>
    </div>

</body>
</html>
